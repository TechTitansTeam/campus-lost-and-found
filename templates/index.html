<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Lost & Found</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🔍 Campus Finder</div>
        <ul class="nav-links">
            <li><a href="/" class="active">Home</a></li>
            <li><a href="/report">Report Item</a></li>
            <li><a href="/feed">Live Feed</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card" style="text-align: center; padding: 50px 30px;">
            <h1 style="font-size: 2.2rem; color: #4158D0;">Lost Something on Campus?</h1>
            <p style="margin-bottom: 25px; color: #636e72;">Report lost items instantly or check live reports from fellow students.</p>
            <div style="display: flex; gap: 15px;">
                <a href="/report" style="flex: 1;"><button>📢 Report an Item</button></a>
                <a href="/feed" style="flex: 1;"><button style="background: linear-gradient(45deg, #00b894, #00cec9);">🔍 Browse Feed</button></a>
            </div>
        </div>
    </div>
</body>
</html>
